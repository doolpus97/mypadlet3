<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 학급 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .login-card {
            max-width: 480px;
            margin: 60px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 40px 30px;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #888;
            font-weight: 600;
            font-size: 1.1rem;
            padding-bottom: 12px;
        }
        .nav-tabs .nav-link.active {
            color: #2b78e4;
            border-bottom: 3px solid #2b78e4;
            background: transparent;
        }
        .form-control-custom {
            background-color: #eef7ff;
            border: none;
            height: 50px;
            border-radius: 10px;
            font-size: 1rem;
        }
        .btn-custom {
            background-color: #3182ce;
            border: none;
            height: 50px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #2b6cb0;
        }
        .board-column {
            min-width: 300px;
            max-width: 320px;
            background: #ebedf0;
            border-radius: 12px;
            padding: 15px;
        }
        .post-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .post-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }
        .board-item-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .board-item-card:hover {
            transform: translateY(-3px);
        }
        .code-badge {
            background-color: #e2e8f0;
            color: #2d3748;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<!-- 1. 로그인 / 입장 화면 -->
<div id="loginSection" class="container">
    <div class="login-card text-center">
        <h2 class="fw-bold mb-2" style="color: #1a202c;">우리반 학급 게시판</h2>
        <p class="text-muted mb-4">학생 또는 교사로 로그인하세요.</p>
        
        <ul class="nav nav-tabs nav-fill mb-4" id="loginTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="student-tab" data-bs-toggle="tab" data-bs-target="#student" type="button">학생 입장</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="teacher-tab" data-bs-toggle="tab" data-bs-target="#teacher" type="button">교사 로그인</button>
            </li>
        </ul>

        <div class="tab-content" id="loginTabContent">
            <!-- 학생 입장 탭 -->
            <div class="tab-pane fade show active text-start" id="student">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">4자리 입장 코드</label>
                    <input type="text" id="entryCode" class="form-control form-control-custom" placeholder="예: 1234">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small text-secondary">학생 이름</label>
                    <input type="text" id="studentName" class="form-control form-control-custom" placeholder="이름 입력">
                </div>
                <button class="btn btn-primary w-100 btn-custom" onclick="enterAsStudent()">게시판 입장하기</button>
            </div>

            <!-- 교사 로그인 탭 -->
            <div class="tab-pane fade text-start" id="teacher">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary">교사 아이디</label>
                    <input type="text" id="teacherId" class="form-control form-control-custom" placeholder="아이디 입력">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small text-secondary">비밀번호</label>
                    <input type="password" id="teacherPw" class="form-control form-control-custom" placeholder="비밀번호 입력">
                </div>
                <button class="btn btn-primary w-100 btn-custom mb-2" onclick="loginTeacher()">교사 로그인</button>
                <button class="btn btn-outline-secondary w-100 fw-bold" style="height: 45px; border-radius: 10px;" onclick="signupTeacher()">교사 회원가입</button>
            </div>
        </div>
    </div>
</div>

<!-- 2. 교사 전용 게시판 관리 대시보드 (게시판 생성 & 코드 확인) -->
<div id="teacherDashboard" class="container py-4 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm">
        <div>
            <h4 class="fw-bold mb-0">📋 내 학급 게시판 관리</h4>
            <span id="teacherInfoDisplay" class="text-secondary small"></span>
        </div>
        <div>
            <button class="btn btn-primary fw-bold me-2" onclick="showCreateBoardModal()">＋ 새 게시판 생성</button>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">로그아웃</button>
        </div>
    </div>

    <div class="row g-3" id="teacherBoardList"></div>
</div>

<!-- 3. 게시판 메인 화면 -->
<div id="boardSection" class="container-fluid px-4 py-3 d-none">
    <nav class="navbar navbar-light bg-white rounded-3 shadow-sm mb-4 px-3">
        <div class="d-flex align-items-center">
            <button id="backToDashBtn" class="btn btn-outline-secondary btn-sm me-3 d-none" onclick="backToDashboard()">← 목록으로</button>
            <span class="navbar-brand fw-bold mb-0" id="boardTitleDisplay">우리반 학급 게시판</span>
            <span id="boardCodeDisplay" class="badge bg-primary fs-6 ms-2"></span>
        </div>
        <div>
            <span id="userInfoDisplay" class="fw-bold me-3 text-secondary"></span>
            <button class="btn btn-success me-2 fw-bold" onclick="showPostModal()">＋ 새 게시물 작성</button>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">나가기</button>
        </div>
    </nav>

    <div class="d-flex gap-3 overflow-auto pb-4" id="boardContainer"></div>
</div>

<!-- 새 게시판 생성 모달 -->
<div class="modal fade" id="createBoardModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">새 학급 게시판 생성</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold small">게시판 제목</label>
                    <input type="text" id="newBoardTitle" class="form-control" placeholder="예: 5학년 1반 국어 게시판">
                </div>
                <div class="alert alert-info small mb-0">
                    💡 게시판을 생성하면 **학생 접속용 4자리 코드**가 자동으로 발급됩니다.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary fw-bold" onclick="createBoard()">생성하기</button>
            </div>
        </div>
    </div>
</div>

<!-- 새 게시물 작성 모달 -->
<div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">새 게시물 작성</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="postForm">
                    <div class="mb-2">
                        <label class="form-label small fw-bold">모둠 선택</label>
                        <select id="postSection" class="form-select">
                            <option value="모둠 1">모둠 1</option>
                            <option value="모둠 2">모둠 2</option>
                            <option value="모둠 3">모둠 3</option>
                            <option value="모둠 4">모둠 4</option>
                            <option value="모둠 5">모둠 5</option>
                            <option value="모둠 6">모둠 6</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">제목</label>
                        <input type="text" id="postTitle" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">내용</label>
                        <textarea id="postContent" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">파일/사진 첨부 (구글 드라이브 저장)</label>
                        <input type="file" id="postFiles" class="form-control" multiple accept="image/*">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="submitPost()">게시하기</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentBoardTitle = "";
    let currentBoardCode = "";
    let currentUser = "";
    let currentTeacherId = "";
    let postModalObj = null;
    let createBoardModalObj = null;

    document.addEventListener("DOMContentLoaded", function() {
        postModalObj = new bootstrap.Modal(document.getElementById('postModal'));
        createBoardModalObj = new bootstrap.Modal(document.getElementById('createBoardModal'));
    });

    // 학생 입장
    async function enterAsStudent() {
        const code = document.getElementById('entryCode').value.trim();
        const name = document.getElementById('studentName').value.trim();
        if (!code || !name) return alert("입장 코드와 이름을 모두 입력하세요.");

        const res = await fetch(`/api/boards/by_code?code=${encodeURIComponent(code)}`);
        const data = await res.json();
        if (data.success) {
            currentUser = `[학생] ${name}`;
            currentBoardTitle = data.board.title;
            currentBoardCode = data.board.code;
            
            document.getElementById('backToDashBtn').classList.add('d-none');
            loadBoard();
        } else {
            alert(data.message || "입장 코드가 올바르지 않습니다.");
        }
    }

    // 교사 로그인
    async function loginTeacher() {
        const id = document.getElementById('teacherId').value.trim();
        const pw = document.getElementById('teacherPw').value.trim();
        if (!id || !pw) return alert("아이디와 비밀번호를 입력하세요.");

        const res = await fetch('/api/login/teacher', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ teacherId: id, teacherPw: pw })
        });
        const data = await res.json();
        if (data.success) {
            currentTeacherId = id;
            currentUser = `[교사] ${id}`;
            showTeacherDashboard();
        } else {
            alert(data.message || "로그인 실패");
        }
    }

    // 교사 회원가입
    async function signupTeacher() {
        const id = document.getElementById('teacherId').value.trim();
        const pw = document.getElementById('teacherPw').value.trim();
        if (!id || !pw) return alert("가입할 아이디와 비밀번호를 입력하세요.");

        const res = await fetch('/api/signup/teacher', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ teacherId: id, teacherPw: pw })
        });
        const data = await res.json();
        alert(data.message);
    }

    // 교사 대시보드 표시 (생성된 게시판 목록 및 입장 코드 확인)
    async function showTeacherDashboard() {
        document.getElementById('loginSection').classList.add('d-none');
        document.getElementById('boardSection').classList.add('d-none');
        document.getElementById('teacherDashboard').classList.remove('d-none');
        document.getElementById('teacherInfoDisplay').innerText = `접속 계정: ${currentTeacherId}`;

        const res = await fetch(`/api/boards?teacherId=${encodeURIComponent(currentTeacherId)}`);
        const data = await res.json();
        
        const listContainer = document.getElementById('teacherBoardList');
        listContainer.innerHTML = '';

        if (data.success && data.boards.length > 0) {
            data.boards.forEach(board => {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="board-item-card">
                        <h5 class="fw-bold text-dark mb-3">${board.title}</h5>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted small">학생 입장 코드</span>
                            <span class="code-badge">${board.code}</span>
                        </div>
                        <button class="btn btn-outline-primary w-100 fw-bold" onclick="openBoard('${board.title}', '${board.code}')">게시판 열기</button>
                    </div>
                `;
                listContainer.appendChild(col);
            });
        } else {
            listContainer.innerHTML = `
                <div class="col-12 text-center py-5 text-muted bg-white rounded-3">
                    아직 생성된 게시판이 없습니다. 상단의 <strong>[＋ 새 게시판 생성]</strong> 버튼을 눌러 추가하세요.
                </div>
            `;
        }
    }

    function showCreateBoardModal() {
        document.getElementById('newBoardTitle').value = '';
        createBoardModalObj.show();
    }

    // 4자리 무작위 코드와 함께 게시판 생성
    async function createBoard() {
        const title = document.getElementById('newBoardTitle').value.trim();
        if (!title) return alert("게시판 제목을 입력하세요.");

        // 4자리 숫자 코드 생성
        const randomCode = Math.floor(1000 + Math.random() * 9000).toString();

        const res = await fetch('/api/boards', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: title,
                code: randomCode,
                teacherId: currentTeacherId
            })
        });

        const data = await res.json();
        if (data.success) {
            createBoardModalObj.hide();
            showTeacherDashboard();
        } else {
            alert(data.message || "게시판 생성 실패");
        }
    }

    function openBoard(title, code) {
        currentBoardTitle = title;
        currentBoardCode = code;
        document.getElementById('backToDashBtn').classList.remove('d-none');
        loadBoard();
    }

    function backToDashboard() {
        showTeacherDashboard();
    }

    function loadBoard() {
        document.getElementById('loginSection').classList.add('d-none');
        document.getElementById('teacherDashboard').classList.add('d-none');
        document.getElementById('boardSection').classList.remove('d-none');
        
        document.getElementById('boardTitleDisplay').innerText = currentBoardTitle;
        document.getElementById('boardCodeDisplay').innerText = `입장코드: ${currentBoardCode}`;
        document.getElementById('userInfoDisplay').innerText = currentUser;
        fetchPosts();
    }

    async function fetchPosts() {
        const res = await fetch(`/api/posts?boardTitle=${encodeURIComponent(currentBoardTitle)}`);
        const data = await res.json();
        if (data.success) {
            renderPosts(data.posts);
        }
    }

    function renderPosts(posts) {
        const container = document.getElementById('boardContainer');
        container.innerHTML = '';

        const sections = ['모둠 1', '모둠 2', '모둠 3', '모둠 4', '모둠 5', '모둠 6'];
        
        sections.forEach(sec => {
            const col = document.createElement('div');
            col.className = 'board-column';
            col.innerHTML = `<h5 class="fw-bold mb-3 text-secondary">${sec}</h5>`;

            const secPosts = posts.filter(p => p.section === sec);
            secPosts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'post-card';
                
                let imgsHtml = '';
                if (p.imgs && p.imgs.length > 0) {
                    p.imgs.forEach(url => {
                        imgsHtml += `<a href="${url}" target="_blank"><img src="${url}" class="post-img" alt="첨부 이미지" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x180?text=Image+Loading+Failed';"></a>`;
                    });
                }

                card.innerHTML = `
                    <div class="small text-muted mb-1">✍️ 작성자: ${p.author || '익명'}</div>
                    <div class="fw-bold fs-6 mb-1">${p.title || ''}</div>
                    <div class="text-secondary small mb-2" style="white-space: pre-wrap;">${p.content || ''}</div>
                    ${imgsHtml}
                `;
                col.appendChild(card);
            });

            container.appendChild(col);
        });
    }

    function showPostModal() {
        document.getElementById('postForm').reset();
        postModalObj.show();
    }

    async function submitPost() {
        const section = document.getElementById('postSection').value;
        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        const fileInput = document.getElementById('postFiles');

        let imgUrls = [];

        if (fileInput.files.length > 0) {
            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }

            const uploadRes = await fetch('/upload', {
                method: 'POST',
                body: formData
            });
            const uploadData = await uploadRes.json();
            if (uploadData.success) {
                imgUrls = uploadData.urls;
            }
        }

        const postRes = await fetch('/api/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                boardTitle: currentBoardTitle,
                section: section,
                author: currentUser,
                title: title,
                content: content,
                imgs: imgUrls
            })
        });

        const postData = await postRes.json();
        if (postData.success) {
            postModalObj.hide();
            fetchPosts();
        } else {
            alert(postData.message || "게시물 작성 실패");
        }
    }

    function logout() {
        location.reload();
    }
</script>
</body>
</html>
