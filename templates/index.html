<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 학급 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .post-card { background-color: #fffdf0; border: 1px solid #f0e68c; border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; }
        .section-col { background-color: #ffffff; border-radius: 10px; padding: 15px; min-height: 500px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <!-- 1. 로그인/입장 화면 -->
    <div id="login-container" class="container mt-5" style="max-width: 500px;">
        <div class="card p-4">
            <h3 class="text-center mb-2 fw-bold">우리반 학급 게시판</h3>
            <p class="text-center text-muted mb-4">학생 또는 교사로 로그인하세요.</p>
            
            <ul class="nav nav-tabs nav-fill mb-4" id="loginTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-bold" id="student-tab" data-bs-toggle="tab" data-bs-target="#student-pane" type="button" role="tab">학생 입장</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-bold" id="teacher-tab" data-bs-toggle="tab" data-bs-target="#teacher-pane" type="button" role="tab">교사 로그인</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-bold" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup-pane" type="button" role="tab">교사 회원가입</button>
                </li>
            </ul>

            <div class="tab-content" id="loginTabContent">
                <!-- 학생 입장 탭 -->
                <div class="tab-pane fade show active" id="student-pane" role="tabpanel">
                    <div class="mb-3">
                        <label class="form-label fw-bold">4자리 입장 코드</label>
                        <input type="text" id="student-code" class="form-control" maxlength="4" placeholder="1234">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">학생 이름</label>
                        <input type="text" id="student-name" class="form-control" placeholder="홍길동">
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-bold" onclick="studentLogin()">게시판 입장하기</button>
                </div>

                <!-- 교사 로그인 탭 -->
                <div class="tab-pane fade" id="teacher-pane" role="tabpanel">
                    <div class="mb-3">
                        <label class="form-label fw-bold">교사 아이디</label>
                        <input type="text" id="teacher-id" class="form-control" placeholder="아이디 입력">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">비밀번호</label>
                        <input type="password" id="teacher-pw" class="form-control" placeholder="비밀번호 입력">
                    </div>
                    <button class="btn btn-dark w-100 py-2 fw-bold" onclick="teacherLogin()">교사 로그인</button>
                </div>

                <!-- 교사 회원가입 탭 -->
                <div class="tab-pane fade" id="signup-pane" role="tabpanel">
                    <div class="mb-3">
                        <label class="form-label fw-bold">사용할 교사 아이디</label>
                        <input type="text" id="signup-id" class="form-control" placeholder="사용할 아이디 입력">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">비밀번호</label>
                        <input type="password" id="signup-pw" class="form-control" placeholder="비밀번호 입력">
                    </div>
                    <button class="btn btn-success w-100 py-2 fw-bold" onclick="teacherSignup()">교사 회원가입</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 교사 메인 대시보드 -->
    <div id="teacher-dashboard" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4><span id="teacher-welcome-name"></span> 선생님 환영합니다! ✨</h4>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">로그아웃</button>
        </div>
        <div class="card p-4 mb-4">
            <h5 class="fw-bold mb-3">새 게시판 만들기</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" id="new-board-title" class="form-control" placeholder="게시판 제목 (예: 나의 장래 희망)">
                </div>
                <div class="col-md-4">
                    <input type="text" id="new-board-code" class="form-control" maxlength="4" placeholder="4자리 입장 코드 (예: 1234)">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="createBoard()">게시판 생성</button>
                </div>
            </div>
        </div>
        <div class="card p-4">
            <h5 class="fw-bold mb-3">내 게시판 목록</h5>
            <div id="board-list-group" class="list-group"></div>
        </div>
    </div>

    <!-- 3. 게시판 상세 화면 -->
    <div id="board-main" class="container-fluid px-4 mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm mb-4">
            <h4 id="current-board-title" class="m-0 fw-bold text-primary"></h4>
            <div>
                <button id="teacher-back-btn" class="btn btn-secondary btn-sm me-2" onclick="goBackToDashboard()" style="display: none;">게시판 목록</button>
                <button class="btn btn-danger btn-sm" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div id="teacher-code-box" class="alert alert-warning mb-4" style="display: none;">
            🔒 현재 학생 입장 코드(4자리): <strong id="display-code" class="text-danger fs-5"></strong>
        </div>

        <div class="card p-4 mb-4">
            <h5 class="fw-bold mb-3">포스트잇 남기기</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <select id="post-section" class="form-select">
                        <option value="모둠 1">모둠 1</option>
                        <option value="모둠 2">모둠 2</option>
                        <option value="모둠 3">모둠 3</option>
                        <option value="모둠 4">모둠 4</option>
                        <option value="모둠 5">모둠 5</option>
                        <option value="모둠 6">모둠 6</option>
                    </select>
                </div>
                <div class="col-md-9">
                    <input type="text" id="post-title" class="form-control" placeholder="제목을 입력하세요 (선택 사항)">
                </div>
                <div class="col-12">
                    <textarea id="post-content" class="form-control" rows="3" placeholder="포스트잇 내용을 입력하세요..."></textarea>
                </div>
                <div class="col-12">
                    <input type="file" id="file-input" class="form-control mb-2" multiple>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary w-100 py-2 fw-bold" onclick="submitPost()">포스트잇 게시하기</button>
                </div>
            </div>
        </div>

        <div class="row g-3" id="sections-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;

        function teacherSignup() {
            const teacherId = document.getElementById('signup-id').value.trim();
            const teacherPw = document.getElementById('signup-pw').value.trim();
            if(!teacherId || !teacherPw) { alert('아이디와 비밀번호를 입력하세요.'); return; }

            fetch('/api/signup/teacher', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({teacherId, teacherPw})
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.success) {
                    document.getElementById('teacher-id').value = teacherId;
                    document.getElementById('signup-id').value = '';
                    document.getElementById('signup-pw').value = '';
                    // 교사 로그인 탭으로 자동 이동
                    var teacherTab = new bootstrap.Tab(document.getElementById('teacher-tab'));
                    teacherTab.show();
                }
            });
        }

        function teacherLogin() {
            const teacherId = document.getElementById('teacher-id').value.trim();
            const teacherPw = document.getElementById('teacher-pw').value.trim();
            if(!teacherId || !teacherPw) { alert('아이디와 비밀번호를 입력하세요.'); return; }

            fetch('/api/login/teacher', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({teacherId, teacherPw})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    currentUser = { type: 'teacher', id: data.teacherId, name: data.teacherId };
                    document.getElementById('login-container').style.display = 'none';
                    document.getElementById('teacher-dashboard').style.display = 'block';
                    document.getElementById('teacher-welcome-name').innerText = data.teacherId;
                    loadTeacherBoards(data.teacherId);
                } else {
                    alert(data.message);
                }
            });
        }

        function loadTeacherBoards(teacherId) {
            fetch(`/api/boards?teacherId=${teacherId}`)
            .then(res => res.json())
            .then(data => {
                const listGroup = document.getElementById('board-list-group');
                listGroup.innerHTML = '';
                if(data.boards.length === 0) {
                    listGroup.innerHTML = '<p class="text-muted">생성된 게시판이 없습니다. 위에서 새로 만들어보세요!</p>';
                    return;
                }
                data.boards.forEach(b => {
                    const item = document.createElement('a');
                    item.href = '#';
                    item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                    item.innerHTML = `<span><strong>${b.title}</strong> (코드: <span class="text-danger">${b.code}</span>)</span> <span class="btn btn-sm btn-outline-primary">입장하기</span>`;
                    item.onclick = (e) => { e.preventDefault(); enterBoard(b); };
                    listGroup.appendChild(item);
                });
            });
        }

        function createBoard() {
            const title = document.getElementById('new-board-title').value.trim();
            const code = document.getElementById('new-board-code').value.trim();
            if(!title || !code) { alert('제목과 4자리 코드를 입력하세요.'); return; }

            fetch('/api/boards', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, code, teacherId: currentUser.id})
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    loadTeacherBoards(currentUser.id);
                    document.getElementById('new-board-title').value = '';
                    document.getElementById('new-board-code').value = '';
                } else {
                    alert(data.message);
                }
            });
        }

        function studentLogin() {
            const code = document.getElementById('student-code').value.trim();
            const name = document.getElementById('student-name').value.trim();
            if(!code || !name) { alert('입장 코드와 이름을 모두 입력하세요.'); return; }

            fetch(`/api/boards/by_code?code=${code}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    currentUser = { type: 'student', name: name, board: data.board };
                    document.getElementById('login-container').style.display = 'none';
                    enterBoard(data.board);
                } else {
                    alert(data.message);
                }
            });
        }

        function enterBoard(board) {
            currentUser.activeBoard = board.title;
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('teacher-dashboard').style.display = 'none';
            document.getElementById('board-main').style.display = 'block';
            document.getElementById('current-board-title').innerText = board.title;

            if(currentUser.type === 'teacher') {
                document.getElementById('teacher-code-box').style.display = 'block';
                document.getElementById('display-code').innerText = board.code;
                document.getElementById('teacher-back-btn').style.display = 'inline-block';
            }

            renderSections();
            loadPosts(board.title);
        }

        function goBackToDashboard() {
            document.getElementById('board-main').style.display = 'none';
            document.getElementById('teacher-dashboard').style.display = 'block';
            loadTeacherBoards(currentUser.id);
        }

        function renderSections() {
            const container = document.getElementById('sections-container');
            container.innerHTML = '';
            for(let i=1; i<=6; i++) {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="section-col">
                        <h5 class="fw-bold text-secondary mb-3">모둠 ${i}</h5>
                        <div id="posts-col-${i}"></div>
                    </div>
                `;
                container.appendChild(col);
            }
        }

        function submitPost() {
            const section = document.getElementById('post-section').value;
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const fileInput = document.getElementById('file-input');

            if(!content && fileInput.files.length === 0) {
                alert('내용을 입력하거나 파일을 첨부해주세요.');
                return;
            }

            const formData = new FormData();
            for(let i=0; i<fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }

            fetch('/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(uploadData => {
                const postData = {
                    boardTitle: currentUser.activeBoard,
                    section: section,
                    author: currentUser.type === 'teacher' ? `[교사] ${currentUser.name}` : currentUser.name,
                    title: title,
                    content: content,
                    imgs: uploadData.urls || []
                };

                return fetch('/api/posts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(postData)
                });
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('post-title').value = '';
                    document.getElementById('post-content').value = '';
                    document.getElementById('file-input').value = '';
                    loadPosts(currentUser.activeBoard);
                } else {
                    alert('게시글 등록에 실패했습니다.');
                }
            });
        }

        function loadPosts(boardTitle) {
            fetch(`/api/posts?boardTitle=${encodeURIComponent(boardTitle)}`)
            .then(res => res.json())
            .then(data => {
                for(let i=1; i<=6; i++) {
                    document.getElementById(`posts-col-${i}`).innerHTML = '';
                }
                if(data.success && data.posts) {
                    data.posts.forEach(p => {
                        const colNum = p.section.replace('모둠 ', '');
                        const targetDiv = document.getElementById(`posts-col-${colNum}`);
                        if(targetDiv) {
                            let filesHtml = '';
                            if(p.imgs && p.imgs.length > 0) {
                                p.imgs.forEach(url => {
                                    if(url.match(/\.(jpeg|jpg|png|gif|webp)$/i) || url.includes('drive.google.com')) {
                                        filesHtml += `<img src="${url}" class="img-fluid rounded mb-2" style="max-height: 150px; object-fit: cover; width: 100%;">`;
                                    } else {
                                        filesHtml += `<a href="${url}" target="_blank" class="d-block btn btn-sm btn-outline-secondary mb-2">첨부 파일 열기</a>`;
                                    }
                                });
                            }

                            const card = document.createElement('div');
                            card.className = 'post-card';
                            card.innerHTML = `
                                <div class="fw-bold text-muted small mb-1">✍️ 작성자: ${p.author}</div>
                                ${p.title ? `<div class="fw-bold mb-1">${p.title}</div>` : ''}
                                <p class="mb-2" style="white-space: pre-wrap; word-break: break-all;">${p.content}</p>
                                ${filesHtml}
                            `;
                            targetDiv.appendChild(card);
                        }
                    });
                }
            });
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
